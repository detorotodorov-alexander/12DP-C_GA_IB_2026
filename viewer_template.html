<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12DP-C · Gelsolin Amyloidosis</title>
<style>
  :root { --ink: #1a1a1a; --soft: #555; --rule: #1a1a1a; --hair: #bdbdbd; --red: #8b1e14; --mark: #fbefc4; }
  * { box-sizing: border-box; }
  html { background: #e9e8e4; scroll-behavior: smooth; }
  body { margin: 0; color: var(--ink); font-family: Georgia, "Times New Roman", serif;
         font-size: 15px; line-height: 1.55; }
  .page { background: #fff; max-width: 1180px; margin: 32px auto; padding: 60px 80px 72px;
          box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  @media (max-width: 700px) { .page { margin: 0; padding: 28px 16px 40px; box-shadow: none; } }

  /* Links: quiet, like footnote references in a printed paper */
  a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--hair);
      text-decoration-thickness: 1px; text-underline-offset: 2px; }
  a:hover { text-decoration-color: var(--ink); }
  a.int { text-decoration-style: dotted; }            /* dotted = jumps inside this page, solid = opens GitHub */
  h1 a, h2 a, h3 a, h4 a { text-decoration: none; }
  h2 a:hover, h3 a:hover, h4 a:hover { text-decoration: underline; }
  :target, .flash { background: var(--mark); transition: background 1.2s; }

  .head { border-top: 3px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 14px 0 12px; margin-bottom: 26px; }
  .kicker { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--soft); }
  .kicker a { color: inherit; }
  h1 { font-size: 27px; font-weight: normal; line-height: 1.25; margin: 6px 0 8px; }
  .meta { font-size: 14px; font-style: italic; color: var(--soft); }
  .meta a { color: inherit; }

  .toc { margin: 0 0 30px; font-size: 14px; }
  .toc b { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
  .toc ol { margin: 6px 0 0; padding-left: 20px; columns: 3 220px; }

  h2 { font-size: 21px; font-weight: bold; margin: 44px 0 10px; padding-bottom: 4px; border-bottom: 1px solid var(--rule); }
  h3 { font-size: 16.5px; font-weight: bold; margin: 26px 0 6px; }
  h4 { font-size: 15px; font-weight: normal; font-style: italic; margin: 24px 0 4px; }
  p, li { hyphens: auto; }
  hr { display: none; }
  code { font-family: Georgia, serif; font-style: italic; background: none; padding: 0; }

  .tw { overflow-x: auto; margin: 10px 0 18px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; line-height: 1.4;
          border-top: 2px solid var(--rule); border-bottom: 2px solid var(--rule); }
  thead th { border-bottom: 1px solid var(--rule); font-weight: bold; text-align: left;
             padding: 7px 8px 6px; vertical-align: bottom; }
  td { padding: 6px 8px; vertical-align: top; border-bottom: 1px solid #e3e3e3; }
  tbody tr:last-child td { border-bottom: 0; }
  td:first-child, td:nth-child(6) { white-space: nowrap; }
  .hi { color: var(--red); font-weight: bold; } .me { font-weight: bold; } .lo { font-style: italic; }

  .mermaid { margin: 14px 0 6px; overflow-x: auto; font-family: "trebuchet ms", verdana, arial, sans-serif; }
  .mermaid a, .mermaid a * { cursor: pointer; }
  .fig { font-size: 13px; font-style: italic; color: var(--soft); margin-top: 0; }

  .files { font-size: 13.5px; columns: 3 240px; padding-left: 0; list-style: none; }
  .files li { break-inside: avoid; padding: 1px 0; }
  .files span { color: var(--soft); }
  .foot { margin-top: 48px; padding-top: 8px; border-top: 1px solid var(--rule); font-size: 12px; color: var(--soft); font-style: italic; }
  .foot a { color: inherit; }

  @media print {
    html { background: #fff; } .page { box-shadow: none; margin: 0; max-width: none; padding: 0; }
    h2 { break-after: avoid; } table, .mermaid { break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="head">
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
    <div class="meta" id="meta"></div>
  </div>
  <div class="toc"><b>Contents</b><ol id="toc"></ol></div>
  <div id="doc"></div>
  <div class="foot" id="foot"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script>
const DATA = /*DATA*/null;
const R = DATA.repo, B = DATA.branch;
const PLAN = "report/project_plan.md";

/* ---------- where things live in the repo ---------- */
const FILES = new Set(DATA.files);
const DIRS = new Set();
DATA.files.forEach(f => { const p = f.split("/"); for (let i = 1; i < p.length; i++) DIRS.add(p.slice(0, i).join("/")); });
["report", "status", "gantt", "references", "files", "files/data", "files/figures", "files/scripts", "files/instructions"].forEach(d => DIRS.add(d));
const blob = p => `${R}/blob/${B}/${encodeURI(p)}`;
const tree = p => `${R}/tree/${B}/${encodeURI(p)}`;
// Any path → the best GitHub URL: the file if it exists, otherwise its folder
function repoUrl(path) {
  path = path.replace(/\/$/, "");
  if (FILES.has(path)) return blob(path);
  if (DIRS.has(path)) return tree(path);
  const parts = path.split("/");
  while (parts.length > 1) { parts.pop(); if (DIRS.has(parts.join("/"))) return tree(parts.join("/")); }
  return R;
}
// GitHub's anchor for a heading of project_plan.md
const slug = t => t.trim().toLowerCase().replace(/[^\p{L}\p{N}\s_-]/gu, "").replace(/ /g, "-");
const planAt = heading => `${blob(PLAN)}#${slug(heading)}`;

const INSTR = { "overview": "Overview.pdf", "formal requirements": "Formal Requirements.pdf",
                "bmc template": "BMC Template.pdf", "rubric": "Marking Rubric.pdf" };
const instrPath = k => "files/instructions/" + INSTR[k.toLowerCase()];
// Commits by each member (GitHub accepts a username or the commit e-mail)
const AUTHORS = { Alexander: "alexander.de.toro@estudiantat.upc.edu", Biel: "biellluch",
                  Arseniy: "slender3604@gmail.com", Isaac: null };
const personUrl = n => AUTHORS[n] ? `${R}/commits/${B}/?author=${encodeURIComponent(AUTHORS[n])}` : `${R}/graphs/contributors`;

const ext = (href, text, title) => `<a class="ext" href="${href}" target="_blank" rel="noopener"${title ? ` title="${title}"` : ""}>${text}</a>`;
const int = (id, text, title) => `<a class="int" href="#${id}"${title ? ` title="${title}"` : ""}>${text}</a>`;

/* ---------- markdown → html ---------- */
const renderer = new marked.Renderer();
const baseCode = renderer.code.bind(renderer);
renderer.code = (code, lang) => lang === "mermaid"
  ? `<div class="mermaid">${code.replace(/</g, "&lt;")}</div>` : baseCode(code, lang);
const baseTable = renderer.table.bind(renderer);
renderer.table = (h, b) => `<div class="tw">${baseTable(h, b)}</div>`;
marked.use({ renderer });

const lines = DATA.plan.split("\n");
const title = lines[0].replace(/^#\s*/, "");
let body = lines.slice(1).join("\n").replace(/^[\s\S]*?(?=\n## )/, m =>
  m.split("\n").filter(l => !/^\*\*(Group|Members)/.test(l)).join("\n"));
const fileItems = DATA.files.map(f => {
  const parts = f.split("/"), name = parts.pop(), dir = parts.join("/");
  return `<li><span>${dir ? `<a class="ext" href="${tree(dir)}" target="_blank" rel="noopener">${dir}/</a>` : ""}</span>${ext(blob(f), name)}</li>`;
}).join("");
const nSec = (body.match(/\n## /g) || []).length + 1;
body += `\n\n## ${nSec}. Repository contents\n\nEvery file in the repository. Each link opens it on GitHub.\n\n<ul class="files">${fileItems}</ul>\n`;

const doc = document.getElementById("doc");
doc.innerHTML = marked.parse(body);

/* ---------- headings: each one opens its place in project_plan.md ---------- */
const toc = document.getElementById("toc");
let h2n = 0;
doc.querySelectorAll("h2, h3, h4").forEach(h => {
  const text = h.textContent;
  const wp = text.match(/^(WP\d)\b/);
  h.id = wp ? wp[1].toLowerCase() : "h-" + slug(text);
  const isRepoSec = h.tagName === "H2" && /Repository contents/.test(text);
  h.innerHTML = isRepoSec ? ext(R, h.innerHTML, "Open the repository on GitHub")
                          : ext(planAt(text), h.innerHTML, "Open this section in project_plan.md on GitHub");
  if (h.tagName === "H2") { h2n++; toc.insertAdjacentHTML("beforeend", `<li>${int(h.id, text.replace(/^\d+\.\s*/, ""))}</li>`); }
});

/* ---------- ids for things other parts point to ---------- */
const TASKS = new Set(), RISKS = new Set(), MILES = new Set();
doc.querySelectorAll("tbody tr").forEach(tr => {
  const c = tr.cells[0]; if (!c) return;
  const id = c.textContent.replace("★", "").trim();
  if (/^\d\.\d+b?$/.test(id)) { tr.id = "task-" + id.replace(".", "-"); TASKS.add(id); }
  else if (/^R\d$/.test(id)) { tr.id = "risk-" + id; RISKS.add(id); }
  else if (/^M\d$/.test(id)) { tr.id = "ms-" + id; MILES.add(id); }
});
doc.querySelectorAll("p > strong:first-child").forEach(s => {
  const m = s.textContent.match(/^(R\d)\.?$/);
  if (m) { s.parentElement.id = "riskplan-" + m[1]; s.innerHTML = int("risk-" + m[1], s.innerHTML, "Back to the risk register"); }
});
// the ID cell of a row opens the row's place in project_plan.md
doc.querySelectorAll("tbody tr[id]").forEach(tr => {
  const sec = tr.closest(".tw").previousElementSibling;
  const head = [...doc.querySelectorAll("h2,h3,h4")].filter(h => h.compareDocumentPosition(tr) & Node.DOCUMENT_POSITION_FOLLOWING).pop();
  const c = tr.cells[0];
  if (tr.id.startsWith("risk-")) c.innerHTML = int("riskplan-" + c.textContent.trim(), c.innerHTML, "Go to the contingency plan");
  else c.innerHTML = ext(planAt(head ? head.textContent : ""), c.innerHTML, "Open in project_plan.md on GitHub");
});

/* ---------- link every mention in the text ---------- */
const RULES = [
  // paths and repo files
  [/\b(?:(?:report|status|gantt|references|files)\/[\w./-]*[\w/]|README\.md|report\.md|project_plan\.md)/g,
    m => { const p = m === "README.md" ? "README.md" : m === "report.md" ? "report/report.md" : m === "project_plan.md" ? PLAN : m;
           return ext(repoUrl(p), m, "Open on GitHub"); }],
  [/\bthis file\b/g, m => ext(blob(PLAN), m, "report/project_plan.md")],
  [/\b(?:the repo(?:sitory)?|the repo)\b/g, m => ext(R, m)],
  [/\bgit tag `?gantt-v1`?|\bgantt-v1\b/g, m => ext(`${R}/tags`, m, "Tags of the repository")],
  // course instructions
  [/\b(Formal Requirements|BMC template|Overview|rubric)\b/gi, m => ext(blob(instrPath(m)), m, "Course instructions in files/instructions/")],
  // status document and live Gantt
  [/\bstatus document\b/gi, m => ext(repoUrl("status/project_status.md"), m, "status/")],
  [/\blive Gantt\b/gi, m => ext(tree("gantt"), m, "gantt/")],
  [/\bfinal Gantt\b/gi, m => ext(tree("gantt"), m, "gantt/")],
  // tasks, work packages, risks, milestones (jump inside this page)
  [/\b[1-8]\.\d{1,2}b?\b(?!\d)/g, m => TASKS.has(m) ? int("task-" + m.replace(".", "-"), m, "Task " + m) : m],
  [/\bWP[1-8]\b/g, m => int(m.toLowerCase(), m, "Work package " + m)],
  [/\bR[1-7]\b/g, m => RISKS.has(m) ? int("risk-" + m, m, "Risk " + m) : m],
  [/\bM[1-6]\b/g, m => MILES.has(m) ? int("ms-" + m, m, "Milestone " + m) : m],
  // people → their commits
  [/\b(Alexander|Arseniy|Biel|Isaac)\b/g, m => ext(personUrl(m), m, AUTHORS[m] ? `Commits by ${m}` : "Contributors")],
];
const SKIP = new Set(["A", "SCRIPT", "STYLE", "svg"]);
function linkify(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: n => {
      for (let p = n.parentElement; p && p !== root; p = p.parentElement)
        if (SKIP.has(p.tagName) || p.classList.contains("mermaid")) return NodeFilter.FILTER_REJECT;
      return n.nodeValue.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    }});
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  nodes.forEach(node => {
    // one pass over the text: find the earliest match of any rule, link it, continue after it
    let text = node.nodeValue, out = "", changed = false;
    while (text) {
      let best = null;
      RULES.forEach(([re, fn]) => { re.lastIndex = 0; const m = re.exec(text);
        if (m && (!best || m.index < best.m.index)) best = { m, fn }; });
      if (!best) { out += esc(text); break; }
      const rep = best.fn(best.m[0]);
      out += esc(text.slice(0, best.m.index)) + (rep === best.m[0] ? esc(rep) : rep);
      if (rep !== best.m[0]) changed = true;
      text = text.slice(best.m.index + best.m[0].length);
    }
    if (changed) { const span = document.createElement("span"); span.innerHTML = out; node.replaceWith(...span.childNodes); }
  });
}
linkify(doc);

/* ---------- header and footer ---------- */
document.title = "12DP-C · " + title;
document.getElementById("title").innerHTML = ext(blob(PLAN), title, "report/project_plan.md on GitHub");
document.getElementById("kicker").innerHTML =
  `Introduction to Bioinformatics · ${ext(blob(instrPath("overview")), "Disease Project")} · 2026–2027`;
document.getElementById("meta").innerHTML =
  `${ext(blob("README.md"), "Group 12DP-C", "README.md")} · ` +
  ["Alexander", "Arseniy", "Biel", "Isaac"].map(n => ext(personUrl(n), n, AUTHORS[n] ? `Commits by ${n}` : "Contributors")).join(", ") +
  ` · ${ext(R, "GitHub repository")} · ${ext(`${R}/commits/${B}`, "history")}`;
document.getElementById("foot").innerHTML =
  `Generated from ${ext(blob(PLAN), "report/project_plan.md")} and ${ext(blob("README.md"), "README.md")} ` +
  `by ${ext(blob("build_viewer.py"), "build_viewer.py")}. The Markdown file in the repository is the reference version.`;

/* ---------- Gantt: same look as on GitHub, every bar clickable ---------- */
doc.querySelectorAll(".mermaid").forEach(div => {
  const code = div.textContent;
  const clicks = [...code.matchAll(/:\s*(?:crit,\s*|done,\s*|active,\s*|milestone,\s*)*(t\d+b?|m\d)\s*,/g)].map(m => {
    const id = m[1];
    if (id.startsWith("m")) return `    click ${id} href "#ms-M${id.slice(1)}"`;
    const task = id.slice(1, 2) + "." + id.slice(2);
    return TASKS.has(task) ? `    click ${id} href "#task-${task.replace(".", "-")}"` : "";
  }).filter(Boolean);
  div.textContent = code.trimEnd() + "\n" + clicks.join("\n") + "\n";
  div.insertAdjacentHTML("afterend",
    `<p class="fig">Figure 1. Gantt chart, version 1 (9 October 2026). The dashed line marks 9 October, the day this version was delivered. Click a bar to go to its task; ` +
    `the chart is also rendered by GitHub in ${ext(planAt(doc.querySelector("h2:nth-of-type(2)")?.textContent || "2. Gantt chart"), "project_plan.md")}.</p>`);
});
mermaid.initialize({ startOnLoad: false, theme: "default", securityLevel: "loose" });
// Vertical line on the snapshot date: everything left of it has already happened
const SNAPSHOT = new Date(2026, 9, 9, 12);   // 9 October 2026, Gantt v1 delivery
const MONTHS = { Jan:0, Feb:1, Mar:2, Apr:3, May:4, Jun:5, Jul:6, Aug:7, Sep:8, Oct:9, Nov:10, Dec:11 };
function drawSnapshot(svg) {
  const ticks = [...svg.querySelectorAll(".grid .tick")].map(t => {
    const m = (t.textContent || "").trim().match(/^(\d{1,2}) (\w{3})/);
    const x = parseFloat((t.getAttribute("transform") || "").replace(/^translate\(([-\d.]+).*/, "$1"));
    return m && !isNaN(x) ? { t, x, d: new Date(2026, MONTHS[m[2]], +m[1]) } : null;
  }).filter(Boolean);
  if (ticks.length < 2) return;
  const [a, b] = [ticks[0], ticks[ticks.length - 1]];
  const x = a.x + (SNAPSHOT - a.d) / (b.d - a.d) * (b.x - a.x);
  const y2 = parseFloat(a.t.querySelector("line").getAttribute("y2"));
  const ns = "http://www.w3.org/2000/svg", grid = a.t.parentNode;
  const line = document.createElementNS(ns, "line");
  Object.entries({ x1: x, x2: x, y1: 0, y2, stroke: "#1a1a1a", "stroke-width": 1.5, "stroke-dasharray": "5 3" })
    .forEach(([k, v]) => line.setAttribute(k, v));
  const label = document.createElementNS(ns, "text");
  Object.entries({ x: x + 4, y: y2 + 12, "font-family": "Georgia, serif", "font-size": 11, "font-style": "italic", fill: "#1a1a1a", "text-anchor": "start" })
    .forEach(([k, v]) => label.setAttribute(k, v));
  label.textContent = "9 Oct · v1 delivered";
  grid.append(line, label);
}
mermaid.run({ querySelector: ".mermaid" }).then(() => {
  // mermaid opens links in a new tab: keep in-page jumps in this page
  doc.querySelectorAll(".mermaid a").forEach(a => { a.removeAttribute("target"); });
  doc.querySelectorAll(".mermaid svg").forEach(drawSnapshot);
});

/* ---------- risk levels ---------- */
doc.querySelectorAll("td").forEach(td => {
  const t = td.textContent.trim();
  if (t === "High") td.className = "hi"; else if (t === "Medium") td.className = "me"; else if (t === "Low") td.className = "lo";
});

/* flash the target after an in-page jump */
document.addEventListener("click", e => {
  const a = e.target.closest('a[href^="#"]'); if (!a) return;
  const el = document.getElementById(decodeURIComponent(a.getAttribute("href").slice(1)));
  if (el) { el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1600); }
});
</script>
</body>
</html>
