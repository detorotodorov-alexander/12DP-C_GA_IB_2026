const DATA = {"plan": "# Molecular basis of Gelsolin Amyloidosis: a structural and comparative analysis of pathogenic GSN variants\n\n**Group 12DP-C** · Introduction to Bioinformatics · 2026–2027\n\n**Members:** Alexander, Arseniy, Biel, Isaac\n\nGantt chart and risk analysis, version 1 (submitted 9 October 2026).\n\n---\n\n## 1. Project overview and team\n\n### General objective\n\nExplain how the pathogenic *GSN* variant assigned to us changes the gelsolin protein, starting from the healthy human gene we are given, and leads to Gelsolin Amyloidosis, and check whether the affected region is conserved in horse (*Equus caballus*) and a second species we are still deciding between mouse (*Mus musculus*) and fly (*Drosophila melanogaster*).\n\n### Specific objectives\n\n1. **Cause (WP2):** collect the healthy human *GSN* gene and gelsolin protein records from UniProt, NCBI and Ensembl, and explain the pathogenic variant we have been assigned.\n2. **Structure (WP3):** place both variants on an experimental gelsolin structure and describe what changes around residue 187, especially at the calcium-binding site.\n3. **Patient impact (WP4):** connect what happens to the protein with amyloid formation and with the symptoms patients have.\n4. **Evolution (WP5):** align human, horse and a second species (mouse or fly, still to decide) gelsolin and measure how conserved D187 and the main domains are.\n\n### Milestones\n\n| ID | Milestone | Date |\n|---|---|---|\n| M1 | Gantt v1 and risk analysis submitted | 09/10/2026 |\n| M2 | Variants and residue numbering agreed | 09/10/2026 |\n| M3 | Main analyses done (structure comparison and alignment) | 19/10/2026 |\n| M4 | Project status review | 22/10/2026 |\n| M5 | Repository frozen (final delivery, 18:00) | 28/10/2026 |\n| M6 | Oral defence | to be confirmed |\n\n### Team and roles\n\nAll four of us are first-year students of the Bachelor's degree in Bioinformatics.\n\n| Member | Role | What they do |\n|---|---|---|\n| Alexander | Planning and structure | Makes and updates the Gantt, keeps track of deadlines and submits the deliverables. Leads WP1, WP3 and WP7. |\n| Arseniy | Sequences and evolution | Gets the horse and second-species sequences (mouse or fly, still deciding) and does the alignment and conservation analysis. Leads WP5 and looks after the README and how we use the repo. |\n| Biel | Report and clinical side | Decides what goes into the report and makes sure it reads as one text. Leads WP4 and WP6. |\n| Isaac | Gene, variants and references | Keeps the status document up to date and the reference list in order. Leads WP2. |\n\n---\n\n## 2. Gantt chart\n\nWe count working days only (Monday to Friday). 12 October is a national holiday and is not counted.\n\n```mermaid\ngantt\n    title 12DP-C · Gelsolin Amyloidosis · Gantt v1\n    dateFormat YYYY-MM-DD\n    axisFormat %d %b\n    excludes weekends, 2026-10-12\n    todayMarker off\n\n    section WP1 Setup and planning\n    1.1 Repo and folders (Alexander)            :t11, 2026-09-28, 1d\n    1.2 Read brief and rubric (All)             :t12, 2026-09-28, 2d\n    1.3 README and conventions (Arseniy)        :t13, 2026-09-29, 2d\n    1.4 Scope, objectives, roles (All)          :t14, 2026-10-05, 1d\n    1.5 Gantt and risk draft (Alexander)        :t15, 2026-09-30, 3d\n    1.6 Status document (Isaac)                 :t16, 2026-10-01, 2d\n    1.7 Review and submit v1 (Alexander + Biel) :t17, 2026-10-09, 1d\n\n    section WP2 Cause\n    2.1 Gene and protein records (Isaac)        :crit, t21, 2026-09-30, 4d\n    2.2 Variant evidence (Isaac)                :crit, t22, 2026-10-06, 3d\n    2.3 Confirm variants (All)                  :crit, t23, 2026-10-09, 1d\n    2.4 Normal function (Isaac)                 :t24, 2026-10-13, 2d\n\n    section WP3 Structure\n    3.1 Choose PDB structure (Alexander)        :t31, 2026-10-13, 1d\n    3.3 Look for variant structures (Biel)      :t33, 2026-10-09, 1d\n    3.2 Map variants (Alexander)                :crit  0d\n    M4 Status review               :milestone, m4, 2026-10-22, 0d\n    M5 Repo frozen                 :milestone, m5, 2026-10-28, 0d\n```\n\nRed bars are the critical path: 2.1 → 2.2 → 2.3 → 3.2 → 3.4 → 4.3 → 6.4 → 6.5 → 6.6 → 7.4. If any of these is late, the final delivery is late.\n\n---\n\n## 3. Work packages and tasks\n\nThe project runs from 28/09/2026 to 04/11/2026 (27 working days). Days are working days; ★ marks the critical path.\n\n#### WP1 · Setup and planning — lead Alexander · 28/09 – 09/10 · 10 days\n\n| ID | Task | Owner | Output | Days | Dates | Depends on | Done when |\n|---|---|---|---|---|---|---|---|\n| 1.1 | Create the repo and folders | Alexander | Repo with report/, status/, gantt/, references/, files/ | 1 | 28/09 | — | The repo exists and all four of us can push to it. |\n| 1.2 | Read the brief and the rubric | All | List of open questions | 2 | 28/09 – 29/09 | — | We have all read the Overview, Formal Requirements, BMC template and rubric. |\n| 1.3 | Write the README and report rules | Arseniy | README.md | 2 | 29/09 – 30/09 | 1.1 | The README explains the project, the folders, and provides information about the authors of the report  |\n| 1.4 | Agree on scope, objectives and roles | All | Section 1 of this file | 1 | 05/10 | 1.2 | Objectives, milestones and roles are written here and we all agree. |\n| 1.5 | Draft the Gantt and risk analysis | Alexander | Draft of this file | 3 | 30/09 – 02/10 | 1.2 | Every task has an owner, output, duration, dates and a \"done when\". |\n| 1.6 | Set up the status document | Isaac | status/project_status.md | 2 | 01/10 – 02/10 | 1.1 | The status document lists every task with its owner, dates and status. |\n| 1.7 | Review and submit Gantt v1 | Alexander, Biel | Repo link on Moodle + git tag `gantt-v1` | 1 | 09/10 | 1.5, 1.6 | A second person has reviewed it and it is submitted before 22:00. |\n\n#### WP2 · Cause — lead Isaac · 30/09 – 14/10 · 10 days\n\n| ID | Task | Owner | Output | Days | Dates | Depends on | Done when |\n|---|---|---|---|---|---|---|---|\n| 2.1 ★ | Get the gene and protein records | Isaac | FASTA files + table of IDs | 4 | 30/09 – 05/10 | 1.2 | The human *GSN* and gelsolin sequences are in the repo with their UniProt, NCBI and Ensembl IDs. |\n| 2.2 ★ | Collect evidence on pathogenic variants | Isaac | Variant table | 3 | 06/10 – 08/10 | 2.1 | A table lists the known variants with position, change, disease and source. |\n| 2.3 ★ | Confirm the assigned variant and the numbering | All | Short justification + numbering note | 1 | 09/10 | 2.2 | We have written which variant we were given and which numbering we use. |\n| 2.4 | Describe how normal gelsolin works | Isaac | Summary of domains and function | 2 | 13/10 – 14/10 | 2.1 | The six domains, calcium activation and actin cutting are explained with references. |\n\n#### WP3 · Structure — lead Alexander · 09/10 – 19/10 · 6 days\n\n| ID | Task | Owner | Output | Days | Dates | Depends on | Done when |\n|---|---|---|---|---|---|---|---|\n| 3.1 | Choose the reference PDB structure | Alexander | PDB ID + reason | 1 | 13/10 | 2.3 | We have picked one structure and explained why (resolution, domain G2, calcium bound). |\n| 3.2 ★ | Show the variants on the structure | Alexander | Figure of D187 in domain G2 | 1 | 14/10 | 2.3, 3.1 | The figure shows residue 187, domain G2 and the calcium site, and it is in files/figures/. |\n| 3.3 | Look for structures of the variant | Biel | Search results | 1 | 09/10 | 2.2 | We know whether the PDB has a usable structure of our assigned variant. |\n| 3.4 ★ | Compare normal vs variant around residue 187 | Alexander, Biel | Comparison figure + text | 3 | 15/10 – 19/10 | 3.2, 3.3 | The figure compares calcium binding and contacts in both cases and the differences are explained. |\n| 3.4b | Backup: build the variants in PyMOL | Alexander | Modelled structures | 2 | 13/10 – 14/10 | 3.3 | Only if 3.3 finds nothing: the models are saved in the repo and their limits are explained. |\n\n#### WP4 · Patient impact — lead Biel · 30/09 – 21/10 · 15 days\n\n| ID | Task | Owner | Output | Days | Dates | Depends on | Done when |\n|---|---|---|---|---|---|---|---|\n| 4.1 | Disease background | Biel | Notes with references | 5 | 30/09 – 06/10 | 1.2 | How common it is, how it is inherited and its symptoms are summarised, citing at least one recent review. |\n| 4.2 | How the disease develops | Biel | Description of the steps | 5 | 07/10 – 14/10 | 4.1 | Each step from the variant to the amyloid deposits is explained and backed by a source. |\n| 4.3 ★ | Link each variant to the symptoms | Biel, Isaac | Short chain per variant | 2 | 20/10 – 21/10 | 2.3, 3.4, 4.2 | For each variant we can go from the protein change to the symptoms, and both agree. |\n\n#### WP5 · Evolution — lead Arseniy · 06/10 – 16/10 · 8 days\n\n| ID | Task | Owner | Output | Days | Dates | Depends on | Done when |\n|---|---|---|---|---|---|---|---|\n| 5.1 | Choose the species | Arseniy | Short justification | 2 | 06/10 – 14/10 | 2.1 | The reasoning behind the choice of the 2 other species is written down and explained. |\n| 5.2 | Get the horse and second-species sequences | Arseniy | FASTA of the 3 sequences | 2 | 08/10 – 14/10 | 2.1, 5.1 | All relevant sequences are written in the report. |\n| 5.3 | Align the three sequences | Arseniy | Alignment file | 2 | 13/10 – 14/10 | 5.2 | The alignment is in the repo, with the tool and settings written down. |\n| 5.4 | Check how conserved D187 is | Arseniy, Alexander | Annotated alignment figure + identity table | 2 | 15/10 – 16/10 | 2.3, 5.3 | Position 187 and the domains are highlighted and identity per domain is in a table. |\n\n#### WP6 · Report — lead Biel · 05/10 – 27/10 · 16 days\n\n| ID | Task | Owner | Output | Days | Dates | Depends on | Done when |\n|---|---|---|---|---|---|---|---|\n| 6.1 | Report skeleton (BMC format) | Biel | report/report.md | 1 | 05/10 | 1.1 | Every BMC section is there with the name of who writes it. |\n| 6.2 | Bibliography | Isaac | Commented reference list | 3 | 09/10 – 14/10 | 4.1 | Every source is listed in Oxford style with one line saying what it is for. |\n| 6.3 | First drafts of Background, Methods and Results | Each WP lead | Drafts in report.md | 3 | 16/10 – 20/10 | 4.2, 5.3 | Each part is written and someone else has read it. |\n| 6.4 ★ | Final Results, Discussion, Abstract and Conclusions | All | Finished sections | 2 | 22/10 – 23/10 | 4.3, 6.3 | The Abstract is under 350 words and we have all approved the text. |\n| 6.5 ★ | Fix references and Declarations | Isaac | Reference list + Declarations | 1 | 26/10 | 6.4 | Every citation in the text is in the list and in Oxford style. |\n| 6.6 ★ | Final review (buffer day) | All | Checked report | 1 | 27/10 | 6.5 | Max 7 pages / 5000 words, max 5 figures or tables, and every claim has a source. |\n\n#### WP7 · Project management — lead Alexander · 28/09 – 28/10 · 22 days\n\n| ID | Task | Owner | Output | Days | Dates | Depends on | Done when |\n|---|---|---|---|---|---|---|---|\n| 7.1 | Keep the status document updated | Isaac | status/project_status.md | 19 | 01/10 – 28/10 | — (alongside 1.6) | Updated at least twice a week with real dates. |\n| 7.2 | Keep the live Gantt updated | Alexander | gantt/ | 12 | 13/10 – 28/10 | 1.7 | At the end of each week it shows the real dates. |\n| 7.3 | Save every source in references/ | All | PDFs in the repo | 22 | 28/09 – 28/10 | — | Every source we cite has its PDF or saved page in references/. |\n| 7.4 ★ | Final Gantt and comparison with v1 | Alexander | Final Gantt + short analysis | 1 | 28/10 | 6.6 | The final Gantt is next to v1 with an explanation of what changed and why. |\n\n#### WP8 · Defence — all · 29/10 – 04/11 · 5 days (dates to confirm when M6 is set)\n\n| ID | Task | Owner | Output | Days | Dates | Depends on | Done when |\n|---|---|---|---|---|---|---|---|\n| 8.1 | Slides | All | Slides | 2 | 29/10 – 30/10 | 6.6 | The slides cover the main results and each of us presents one part. |\n| 8.2 | First rehearsal | All | Feedback notes | 1 | 03/11 | 8.1 | We have done a full run within the time limit and noted what to fix. |\n| 8.3 | Second rehearsal | All | Final timing | 1 | 04/11 | 8.2 | Feedback is applied and any of us can answer questions on any part. |\n\n---\n\n## 4. Risk analysis\n\nEach risk gets a likelihood (L) and an impact (I) from 1 to 3. **Score = L × I**: 1–2 Low, 3–5 Medium, 6–9 High. We check the risks every week in the status document.\n\n\n| ID | Risk | L | I | Score | Level | Owner |\n|---|---|---|---|---|---|---|\n| R1 | There is no experimental structure of the variants | 2 | 3 | 6 | High | Alexander |\n| R2 | Sources number the residue differently (187 vs 214) | 3 | 2 | 6 | High | Isaac |\n| R3 | The structure comparison (3.4) takes longer than planned | 2 | 3 | 6 | High | Alexander |\n| R4 | One of us is away on a day when a critical task is due | 3 | 2 | 6 | High | Isaac |\n| R5 | Horse or second-species records are unreviewed or have several isoforms | 2 | 2 | 4 | Medium | Arseniy |\n| R6 | The report goes over the page, word or figure limit | 2 | 2 | 4 | Medium | Biel |\n| R7 | We make mistakes with git and GitHub (unneeded branches, wrong merges, lost changes) | 3 | 1 | 3 | Medium | Arseniy |\n\n**R1.** Our identified risk is that there is no experimental structure of gelsolin with our assigned variant, we have realized because most gelsolin structures in the PDB are of the normal protein or of single domains; our contingency plan consists of building the variant in PyMOL on the normal structure (task 3.4b) and saying clearly that it is a model, not experimental data. We will know on 9 October, after task 3.3.\n\n**R2.** Our identified risk is that the same residue appears with different numbers (for example D187 and D214), we have realized because papers number the mature protein while UniProt counts the signal peptide too; our contingency plan consists of choosing one numbering in task 2.3, keeping a small conversion table in the repo and checking every number in the final review (6.6).\n\n**R3.** Our identified risk is that the structure comparison (3.4) is late, we have realized because it is the longest task on the critical path and 4.3 and 6.4 wait for it; our contingency plan consists of starting the report drafts (6.3) without waiting for it, keeping 27 and 28 October as buffer, and reducing the comparison to the single most informative region of the protein if 3.4 is not done by 19 October.\n\n**R4.** Our identified risk is that one of us is away on a day when a critical-path task is due, we have realized because several of us travel during the term (Alexander, for example, will be away more than once in October) and the project overlaps with other courses; our contingency plan consists of planning with margin: critical tasks are finished at least one working day before the task that depends on them, 27 and 28 October are kept free as buffer, each work package has a backup member (Alexander ↔ Arseniy, Isaac ↔ Biel), and everyone writes their absences in the status document in advance.\n\n**R5.** Our identified risk is that the horse or second-species gelsolin record is not reviewed or has several isoforms, we have realized because the horse entry may not be curated and gelsolin has a plasma and a cytoplasmic form; our contingency plan consists of using reviewed Swiss-Prot entries if they exist, comparing the same isoform in all three species and cross-checking with Ensembl and RefSeq.\n\n**R6.** Our identified risk is going over 7 pages, 5000 words or 5 figures, we have realized because the disease mechanism plus three analyses is a lot to fit; our contingency plan consists of deciding the figures now (from 3.2, 3.4 and 5.4, plus at most two tables), giving each section a word limit and counting words in task 6.6.\n\n**R7.** Our identified risk is that we make mistakes with git and GitHub, such as creating branches we do not need, merging in the wrong direction or overwriting each other's work, we have realized because we are new to both tools and it has already happened (we created extra branches and one personal branch did not share history with main); our plan to avoid this issue consists of each of us working only on our own branch and merging into main through a pull request reviewed by another member, committing often, notifying others if making any changes to the main branch, and asking an LLM to explain each git step before we run it, as the course allows using GenAI to understand concepts (we still run the commands and make the commits ourselves).\n", "readme": "# Gelsolin Amyloidosis - Disease Project - 12DP-C\n**Course:** Introduction to Bioinformatics · UPC · 2026–2027\n\n**Group:** 12DP-C\n\n**Authors:** Alexander, Biel, Isaac, Arseniy.\n\n## Description:\nIn this report we will be exploring how the changes in gene and/or protein sequence and structure explain the molecular basis of Gelsolin Amyloidosis, what the differences are at gene, protein, structure, and function levels between a reference state and the disease-associated state, as well as the difference in all of those levels between humans and 2 other species and what biological implications they have in relation to the disease. We will be particularly looking into how the pathogenic *GSN* variant assigned to us causes Gelsolin Amyloidosis, starting from the healthy human gene we are given, what it changes in the protein structure, how that leads to the disease, and whether the affected region is conserved in horse and a second species we are still deciding between mouse and fly.\n\n## Where to start\n- `index.html` – a simple viewer with the whole plan (overview, Gantt chart, tasks, risks and the list of files). Download it and open it in a browser.\n- `report/project_plan.md` – Gantt chart and risk analysis (version 1, submitted 9 October 2026). GitHub shows the Gantt chart directly.\n- `report/report.md` – the report (BMC Bioinformatics format), in progress.\n\n## Repository Structure\n- `report.md` — main report document\n- `gantt` - live gantt, updated during the project\n- `status` -  project status document\n- `files/data` - sequences, alignments and other data\n- `files/figures` — images and plots referenced in the report\n- `files/scripts` - scripts\n- `files/instructions` - all the course instructions (rubric, BMC template, etc.)\n- `references` - a list of all the references used in the report\n- `README.md` — this file\n\n## Commit messages\nShort and in English, starting with a verb ex. `Add D187 variant table`, `Fix residue numbering in Results`.\n\n## How to Read This Report\nOpen `report.md` directly on GitHub it renders automatically.\nTo read it locally, open the file in VS Code or any Markdown viewer.\n", "files": ["README.md", "build_viewer.py", "files/archive/Saved task specifications", "files/instructions/BMC Template.pdf", "files/instructions/Formal Requirements.pdf", "files/instructions/Marking Rubric.pdf", "files/instructions/Overview.pdf", "files/instructions/Setting up your repository.pdf", "gantt/gantt_live.md", "gantt/gantt_v1.md", "index.html", "references/placeholder.md", "report/project_plan.md", "report/report.md", "status/placeholder.md", "status/project_status.md", "viewer_template.html"], "repo": "https://github.com/detorotodorov-alexander/12DP-C_GA_IB_2026", "branch": "main"};

const DIRS = new Set();
DATA.files.forEach(f => { const p = f.split("/"); for (let i = 1; i < p.length; i++) DIRS.add(p.slice(0, i).join("/")); });
["report", "status", "gantt", "references", "files", "files/data", "files/figures", "files/scripts", "files/instructions"].forEach(d => DIRS.add(d));
const blob = p => `${R}/blob/${B}/${encodeURI(p)}`;
const tree = p => `${R}/tree/${B}/${encodeURI(p)}`;
// Any path → the best GitHub URL: the file if it exists, otherwise its folder
function repoUrl(path) {
  path = path.replace(/\/$/, "");
  if (FILES.has(path)) return blob(path);
  if (DIRS.has(path)) return tree(path);
  const parts = path.split("/");
  while (parts.length > 1) { parts.pop(); if (DIRS.has(parts.join("/"))) return tree(parts.join("/")); }
  return R;
}
// GitHub's anchor for a heading of project_plan.md
const slug = t => t.trim().toLowerCase().replace(/[^\p{L}\p{N}\s_-]/gu, "").replace(/ /g, "-");
const planAt = heading => `${blob(PLAN)}#${slug(heading)}`;

const INSTR = { "overview": "Overview.pdf", "formal requirements": "Formal Requirements.pdf",
                "bmc template": "BMC Template.pdf", "rubric": "Marking Rubric.pdf" };
const instrPath = k => "files/instructions/" + INSTR[k.toLowerCase()];
// Commits by each member (GitHub accepts a username or the commit e-mail)
const AUTHORS = { Alexander: "alexander.de.toro@estudiantat.upc.edu", Biel: "biellluch",
                  Arseniy: "slender3604@gmail.com", Isaac: null };
const personUrl = n => AUTHORS[n] ? `${R}/commits/${B}/?author=${encodeURIComponent(AUTHORS[n])}` : `${R}/graphs/contributors`;

const ext = (href, text, title) => `<a class="ext" href="${href}" target="_blank" rel="noopener"${title ? ` title="${title}"` : ""}>${text}</a>`;
const int = (id, text, title) => `<a class="int" href="#${id}"${title ? ` title="${title}"` : ""}>${text}</a>`;

/* ---------- markdown → html ---------- */
const renderer = new marked.Renderer();
const baseCode = renderer.code.bind(renderer);
renderer.code = (code, lang) => lang === "mermaid"
  ? `<div class="mermaid">${code.replace(/</g, "&lt;")}</div>` : baseCode(code, lang);
const baseTable = renderer.table.bind(renderer);
renderer.table = (h, b) => `<div class="tw">${baseTable(h, b)}</div>`;
marked.use({ renderer });

const lines = DATA.plan.split("\n");
const title = lines[0].replace(/^#\s*/, "");
let body = lines.slice(1).join("\n").replace(/^[\s\S]*?(?=\n## )/, m =>
  m.split("\n").filter(l => !/^\*\*(Group|Members)/.test(l)).join("\n"));
const fileItems = DATA.files.map(f => {
  const parts = f.split("/"), name = parts.pop(), dir = parts.join("/");
  return `<li><span>${dir ? `<a class="ext" href="${tree(dir)}" target="_blank" rel="noopener">${dir}/</a>` : ""}</span>${ext(blob(f), name)}</li>`;
}).join("");
const nSec = (body.match(/\n## /g) || []).length + 1;
body += `\n\n## ${nSec}. Repository contents\n\nEvery file in the repository. Each link opens it on GitHub.\n\n<ul class="files">${fileItems}</ul>\n`;

const doc = document.getElementById("doc");
doc.innerHTML = marked.parse(body);

/* ---------- headings: each one opens its place in project_plan.md ---------- */
const toc = document.getElementById("toc");
let h2n = 0;
doc.querySelectorAll("h2, h3, h4").forEach(h => {
  const text = h.textContent;
  const wp = text.match(/^(WP\d)\b/);
  h.id = wp ? wp[1].toLowerCase() : "h-" + slug(text);
  const isRepoSec = h.tagName === "H2" && /Repository contents/.test(text);
  h.innerHTML = isRepoSec ? ext(R, h.innerHTML, "Open the repository on GitHub")
                          : ext(planAt(text), h.innerHTML, "Open this section in project_plan.md on GitHub");
  if (h.tagName === "H2") { h2n++; toc.insertAdjacentHTML("beforeend", `<li>${int(h.id, text.replace(/^\d+\.\s*/, ""))}</li>`); }
});

/* ---------- ids for things other parts point to ---------- */
const TASKS = new Set(), RISKS = new Set(), MILES = new Set();
doc.querySelectorAll("tbody tr").forEach(tr => {
  const c = tr.cells[0]; if (!c) return;
  const id = c.textContent.replace("★", "").trim();
  if (/^\d\.\d+b?$/.test(id)) { tr.id = "task-" + id.replace(".", "-"); TASKS.add(id); }
  else if (/^R\d$/.test(id)) { tr.id = "risk-" + id; RISKS.add(id); }
  else if (/^M\d$/.test(id)) { tr.id = "ms-" + id; MILES.add(id); }
});
doc.querySelectorAll("p > strong:first-child").forEach(s => {
  const m = s.textContent.match(/^(R\d)\.?$/);
  if (m) { s.parentElement.id = "riskplan-" + m[1]; s.innerHTML = int("risk-" + m[1], s.innerHTML, "Back to the risk register"); }
});
// the ID cell of a row opens the row's place in project_plan.md
doc.querySelectorAll("tbody tr[id]").forEach(tr => {
  const sec = tr.closest(".tw").previousElementSibling;
  const head = [...doc.querySelectorAll("h2,h3,h4")].filter(h => h.compareDocumentPosition(tr) & Node.DOCUMENT_POSITION_FOLLOWING).pop();
  const c = tr.cells[0];
  if (tr.id.startsWith("risk-")) c.innerHTML = int("riskplan-" + c.textContent.trim(), c.innerHTML, "Go to the contingency plan");
  else c.innerHTML = ext(planAt(head ? head.textContent : ""), c.innerHTML, "Open in project_plan.md on GitHub");
});

/* ---------- link every mention in the text ---------- */
const RULES = [
  // paths and repo files
  [/\b(?:(?:report|status|gantt|references|files)\/[\w./-]*[\w/]|README\.md|report\.md|project_plan\.md)/g,
    m => { const p = m === "README.md" ? "README.md" : m === "report.md" ? "report/report.md" : m === "project_plan.md" ? PLAN : m;
           return ext(repoUrl(p), m, "Open on GitHub"); }],
  [/\bthis file\b/g, m => ext(blob(PLAN), m, "report/project_plan.md")],
  [/\b(?:the repo(?:sitory)?|the repo)\b/g, m => ext(R, m)],
  [/\bgit tag `?gantt-v1`?|\bgantt-v1\b/g, m => ext(`${R}/tags`, m, "Tags of the repository")],
  // course instructions
  [/\b(Formal Requirements|BMC template|Overview|rubric)\b/gi, m => ext(blob(instrPath(m)), m, "Course instructions in files/instructions/")],
  // status document and live Gantt
  [/\bstatus document\b/gi, m => ext(repoUrl("status/project_status.md"), m, "status/")],
  [/\blive Gantt\b/gi, m => ext(tree("gantt"), m, "gantt/")],
  [/\bfinal Gantt\b/gi, m => ext(tree("gantt"), m, "gantt/")],
  // tasks, work packages, risks, milestones (jump inside this page)
  [/\b[1-8]\.\d{1,2}b?\b(?!\d)/g, m => TASKS.has(m) ? int("task-" + m.replace(".", "-"), m, "Task " + m) : m],
  [/\bWP[1-8]\b/g, m => int(m.toLowerCase(), m, "Work package " + m)],
  [/\bR[1-7]\b/g, m => RISKS.has(m) ? int("risk-" + m, m, "Risk " + m) : m],
  [/\bM[1-6]\b/g, m => MILES.has(m) ? int("ms-" + m, m, "Milestone " + m) : m],
  // people → their commits
  [/\b(Alexander|Arseniy|Biel|Isaac)\b/g, m => ext(personUrl(m), m, AUTHORS[m] ? `Commits by ${m}` : "Contributors")],
];
const SKIP = new Set(["A", "SCRIPT", "STYLE", "svg"]);
function linkify(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: n => {
      for (let p = n.parentElement; p && p !== root; p = p.parentElement)
        if (SKIP.has(p.tagName) || p.classList.contains("mermaid")) return NodeFilter.FILTER_REJECT;
      return n.nodeValue.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    }});
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  nodes.forEach(node => {
    // one pass over the text: find the earliest match of any rule, link it, continue after it
    let text = node.nodeValue, out = "", changed = false;
    while (text) {
      let best = null;
      RULES.forEach(([re, fn]) => { re.lastIndex = 0; const m = re.exec(text);
        if (m && (!best || m.index < best.m.index)) best = { m, fn }; });
      if (!best) { out += esc(text); break; }
      const rep = best.fn(best.m[0]);
      out += esc(text.slice(0, best.m.index)) + (rep === best.m[0] ? esc(rep) : rep);
      if (rep !== best.m[0]) changed = true;
      text = text.slice(best.m.index + best.m[0].length);
    }
    if (changed) { const span = document.createElement("span"); span.innerHTML = out; node.replaceWith(...span.childNodes); }
  });
}
linkify(doc);

/* ---------- header and footer ---------- */
document.title = "12DP-C · " + title;
document.getElementById("title").innerHTML = ext(blob(PLAN), title, "report/project_plan.md on GitHub");
document.getElementById("kicker").innerHTML =
  `Introduction to Bioinformatics · ${ext(blob(instrPath("overview")), "Disease Project")} · 2026–2027`;
document.getElementById("meta").innerHTML =
  `${ext(blob("README.md"), "Group 12DP-C", "README.md")} · ` +
  ["Alexander", "Arseniy", "Biel", "Isaac"].map(n => ext(personUrl(n), n, AUTHORS[n] ? `Commits by ${n}` : "Contributors")).join(", ") +
  ` · ${ext(R, "GitHub repository")} · ${ext(`${R}/commits/${B}`, "history")}`;
document.getElementById("foot").innerHTML =
  `Generated from ${ext(blob(PLAN), "report/project_plan.md")} and ${ext(blob("README.md"), "README.md")} ` +
  `by ${ext(blob("build_viewer.py"), "build_viewer.py")}. The Markdown file in the repository is the reference version.`;

/* ---------- Gantt: same look as on GitHub, every bar clickable ---------- */
doc.querySelectorAll(".mermaid").forEach(div => {
  const code = div.textContent;
  const clicks = [...code.matchAll(/:\s*(?:crit,\s*|done,\s*|active,\s*|milestone,\s*)*(t\d+b?|m\d)\s*,/g)].map(m => {
    const id = m[1];
    if (id.startsWith("m")) return `    click ${id} href "#ms-M${id.slice(1)}"`;
    const task = id.slice(1, 2) + "." + id.slice(2);
    return TASKS.has(task) ? `    click ${id} href "#task-${task.replace(".", "-")}"` : "";
  }).filter(Boolean);
  div.textContent = code.trimEnd() + "\n" + clicks.join("\n") + "\n";
  div.insertAdjacentHTML("afterend",
    `<p class="fig">Figure 1. Gantt chart, version 1 (9 October 2026). The dashed line marks 9 October, the day this version was delivered. Click a bar to go to its task; ` +
    `the chart is also rendered by GitHub in ${ext(planAt(doc.querySelector("h2:nth-of-type(2)")?.textContent || "2. Gantt chart"), "project_plan.md")}.</p>`);
});
mermaid.initialize({ startOnLoad: false, theme: "default", securityLevel: "loose" });
// Vertical line on the snapshot date: everything left of it has already happened
const SNAPSHOT = new Date(2026, 9, 9, 12);   // 9 October 2026, Gantt v1 delivery
const MONTHS = { Jan:0, Feb:1, Mar:2, Apr:3, May:4, Jun:5, Jul:6, Aug:7, Sep:8, Oct:9, Nov:10, Dec:11 };
function drawSnapshot(svg) {
  const ticks = [...svg.querySelectorAll(".grid .tick")].map(t => {
    const m = (t.textContent || "").trim().match(/^(\d{1,2}) (\w{3})/);
    const x = parseFloat((t.getAttribute("transform") || "").replace(/^translate\(([-\d.]+).*/, "$1"));
    return m && !isNaN(x) ? { t, x, d: new Date(2026, MONTHS[m[2]], +m[1]) } : null;
  }).filter(Boolean);
  if (ticks.length < 2) return;
  const [a, b] = [ticks[0], ticks[ticks.length - 1]];
  const x = a.x + (SNAPSHOT - a.d) / (b.d - a.d) * (b.x - a.x);
  const y2 = parseFloat(a.t.querySelector("line").getAttribute("y2"));
  const ns = "http://www.w3.org/2000/svg", grid = a.t.parentNode;
  const line = document.createElementNS(ns, "line");
  Object.entries({ x1: x, x2: x, y1: 0, y2, stroke: "#1a1a1a", "stroke-width": 1.5, "stroke-dasharray": "5 3" })
    .forEach(([k, v]) => line.setAttribute(k, v));
  const label = document.createElementNS(ns, "text");
  Object.entries({ x: x + 4, y: y2 + 12, "font-family": "Georgia, serif", "font-size": 11, "font-style": "italic", fill: "#1a1a1a", "text-anchor": "start" })
    .forEach(([k, v]) => label.setAttribute(k, v));
  label.textContent = "9 Oct · v1 delivered";
  grid.append(line, label);
}
mermaid.run({ querySelector: ".mermaid" }).then(() => {
  // mermaid opens links in a new tab: keep in-page jumps in this page
  doc.querySelectorAll(".mermaid a").forEach(a => { a.removeAttribute("target"); });
  doc.querySelectorAll(".mermaid svg").forEach(drawSnapshot);
});

/* ---------- risk levels ---------- */
doc.querySelectorAll("td").forEach(td => {
  const t = td.textContent.trim();
  if (t === "High") td.className = "hi"; else if (t === "Medium") td.className = "me"; else if (t === "Low") td.className = "lo";
});

/* flash the target after an in-page jump */
document.addEventListener("click", e => {
  const a = e.target.closest('a[href^="#"]'); if (!a) return;
  const el = document.getElementById(decodeURIComponent(a.getAttribute("href").slice(1)));
  if (el) { el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1600); }
});
</script>
